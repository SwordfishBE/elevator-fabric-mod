plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        elevator {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://maven.shedaniel.me/' }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    if (!project.hasProperty('withoutCloth')) {
        localRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude group: "net.fabricmc.fabric-api"
        }
    }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

test {
    useJUnitPlatform()
}

if (project.hasProperty('clientTests')) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'elevator_client_tests'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
    sourceSets.gametest.java.srcDir('src/clientTest/java')
    sourceSets.gametest.resources.srcDir('src/clientTest/resources')
    sourceSets.gametest.compileClasspath += sourceSets.client.output
    sourceSets.gametest.compileClasspath += sourceSets.client.compileClasspath
    sourceSets.gametest.runtimeClasspath += sourceSets.client.output
    sourceSets.gametest.runtimeClasspath += sourceSets.client.runtimeClasspath
}
